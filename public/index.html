<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <header class="masthead">
    <div><span class="brand">Validación de expertos</span><span class="brand-sub">Diagnóstico para startups en fase temprana</span></div>
    <span class="version">V1.9 · Candidata</span>
  </header>
  <div class="workspace">
    <aside class="sidebar" aria-label="Recorrido y progreso">
      <details class="outline">
        <summary>Ir a una sección</summary>
        <nav id="step-nav" aria-label="Pasos del cuestionario"></nav>
      </details>
      <div class="progress-box">
        <label for="progress">Avance de la evaluación</label>
        <progress id="progress" value="0"></progress>
        <p id="progress-text">6 dimensiones y 21 preguntas</p>
        <p class="fine">Cada bloque es una dimensión o una pregunta. Las omisiones se cuentan por separado.</p>
      </div>
      <details class="draft-tools"><summary>Opciones de guardado</summary>
        <button type="button" id="import-button" class="text-button">Recuperar un archivo de respuestas</button>
        <input id="import-file" type="file" accept=".json,application/json" hidden aria-label="Archivo de respuestas V1.9">
        <button type="button" id="reset-button" class="text-button">Comenzar otra respuesta</button>
      </details>
    </aside>
    <main id="main" tabindex="-1">
      <div id="message" role="alert" hidden></div>
      <div id="app"></div>
      <noscript><div class="notice">Este formulario necesita JavaScript para guardar y exportar respuestas. Abra el archivo en un navegador con JavaScript habilitado.</div></noscript>
      <footer class="save-footer"><span id="save-state" role="status">Preparando el guardado local…</span><span id="save-time"></span></footer>
    </main>
  </div>
  <div id="print-view"></div>
  <script>(function (root) {
  'use strict';
  const instrument = {
    version: '1.9.0',
    title: 'Validación de expertos',
    researcherEmail: 'luis.gonzalezc@urjc.es',
    purpose: 'Identificar brechas de evidencia y de capacidad de ejecución para priorizar el siguiente hito de una startup en fase temprana.',
    population: 'Startups desde la exploración de una idea hasta las primeras señales de repetición comercial. La pertinencia de cada pregunta depende de la fase y del modelo de negocio.',
    source: 'Revisión de V1.8. Conserva las seis dimensiones y los dos juicios por pregunta. V1.9 reformula varios enunciados y anclajes para alinearlos con la evidencia de origen y añade un ítem sobre estructura de propiedad, hasta veintiuna preguntas; candidata pendiente de validación.',
    expertCriteria: { relevance: 'Relevancia de la pregunta, de 1 a 4.', usability: 'Valoración conjunta de claridad de la pregunta y adecuación de sus respuestas, de 1 a 4. Los problemas específicos se explican en Observaciones.' },
    dimensions: [
      { id: 'D1', short: 'Equipo', name: 'Equipo y gobernanza', desc: 'Capacidades disponibles, aprendizaje, dedicación y acuerdos para ejecutar el siguiente hito.' },
      { id: 'D2', short: 'Mercado', name: 'Problema y mercado', desc: 'Segmento prioritario, evidencia del problema, mercado accesible y condiciones de adopción.' },
      { id: 'D3', short: 'Propuesta de valor', name: 'Propuesta de valor y modelo de negocio', desc: 'Ventaja percibida, hipótesis de monetización y resultados de las pruebas de la solución.' },
      { id: 'D4', short: 'Evidencia comercial', name: 'Evidencia comercial', desc: 'Compromisos verificables y pruebas de adquisición de clientes en el segmento elegido.' },
      { id: 'D5', short: 'Finanzas', name: 'Evidencia financiera', desc: 'Control de caja, previsión, recursos para el siguiente hito y economía del cliente cuando sea aplicable.' },
      { id: 'D6', short: 'Recursos y confianza', name: 'Recursos estratégicos y legitimidad', desc: 'Relaciones y evidencias de confianza que facilitan recursos, acceso al mercado o acuerdos.' }
    ],
    items: [
      { id: 'T1', dim: 'D1', q: '¿Están cubiertos los perfiles que exige este modelo de negocio: quién construye o entrega la solución y quién vende y accede al cliente?',
        note: 'Los perfiles pueden estar dentro del equipo o cubiertos con colaboradores estables. Externalizar no penaliza, pero un perfil crítico sin compromiso estable es una dependencia, no una cobertura. El conocimiento del sector se valora en T2.',
        levels: ['No se ha analizado qué perfiles exige este modelo de negocio.', 'Se sabe qué perfiles faltan, pero su cobertura todavía no está asegurada.', 'Los perfiles críticos están cubiertos y hay un responsable identificado para cada uno.', 'Esa combinación ya ha permitido cumplir hitos comparables y las piezas cubiertas desde fuera tienen un compromiso estable.'] },
      { id: 'T2', dim: 'D1', q: '¿El equipo dispone de conocimiento directo del cliente, sector o problema para tomar decisiones?',
        note: 'Puede proceder de experiencia previa, investigación directa o colaboración continuada con personas conocedoras del contexto. Distinga el conocimiento técnico del sector del conocimiento comercial: quién compra, cómo compra y con qué ciclos.',
        levels: ['Las decisiones se apoyan principalmente en supuestos sin contraste directo.', 'Hay conocimiento indirecto o contactos puntuales, con lagunas relevantes.', 'El equipo dispone de conocimiento directo sobre el cliente y su contexto.', 'Ese conocimiento ha permitido corregir supuestos y fundamentar decisiones concretas.'] },
      { id: 'T3', dim: 'D1', q: '¿El equipo convierte la evidencia y los aprendizajes en decisiones sobre el proyecto?',
        note: 'Considere un ejemplo reciente de una decisión confirmada o modificada a partir de una prueba. No se exige haber fundado antes otra empresa.',
        levels: ['No se identifican hipótesis ni aprendizajes concretos.', 'Se comentan aprendizajes, pero no se relacionan con decisiones.', 'Se registran pruebas o experiencias y las decisiones que se toman a partir de ellas.', 'Se revisan sistemáticamente los resultados y se ajustan prioridades cuando la evidencia contradice la hipótesis inicial o cuando el criterio procede de fuera del equipo.'] },
      { id: 'T4', dim: 'D1', q: '¿La dedicación disponible permite ejecutar las prioridades de esta fase?',
        note: 'Valore las últimas cuatro semanas o, si el proyecto es más reciente, el periodo desde su inicio. No se exige dedicación exclusiva; valore la continuidad, también ante contratiempos.',
        levels: ['La falta de tiempo bloquea las prioridades principales.', 'Hay tiempo disponible, pero se incumplen repetidamente las tareas prioritarias.', 'La dedicación permite ejecutar las tareas principales del periodo.', 'La dedicación se planifica y se sostiene ante contratiempos, cumpliendo los hitos comprometidos de forma consistente.'] },
      { id: 'T5', dim: 'D1', q: '¿Están claros y documentados los acuerdos necesarios para tomar decisiones y distribuir responsabilidades?',
        note: 'Adapte al equipo: responsabilidades, forma de tomar decisiones importantes y delegación en colaboradores. La estructura de propiedad se valora por separado en T6.',
        levels: ['No están claros los responsables ni cómo se toman decisiones importantes.', 'Existen acuerdos verbales o parciales sobre responsabilidades y decisiones.', 'Los acuerdos relevantes para la estructura actual están documentados y son conocidos.', 'Se revisan ante cambios del equipo y contemplan cómo resolver desacuerdos, ausencias o salidas.'] },
      { id: 'T6', dim: 'D1', q: '¿La estructura de propiedad permite decidir con agilidad y no compromete etapas futuras?',
        note: 'Valore el efecto del reparto sobre la toma de decisiones y sobre la capacidad de incorporar personas clave o inversores más adelante. El vesting solo se considera si procede.',
        conditional: 'No aplica todavía: si no hay sociedad constituida ni socios o inversores con participación. Se registraría aparte, nunca como 0. Si existe reparto pero no se ha revisado, corresponde el nivel 0.',
        levels: ['No se ha revisado cómo afecta el reparto a la toma de decisiones.', 'Se conoce el reparto, pero no se han valorado sus efectos sobre decisiones o incorporaciones futuras.', 'El reparto permite decidir sin bloqueos y no hay participaciones relevantes en manos de personas ajenas a la actividad.', 'Existen mecanismos previstos para salidas, incorporaciones y desbloqueo de decisiones, y se revisan cuando cambia el equipo.'] },
      { id: 'PM1', dim: 'D2', q: '¿Está definido el segmento prioritario al que se dirigen las pruebas y acciones comerciales?',
        note: 'Cuando sean diferentes, distinga usuario, comprador y pagador.',
        levels: ['El mercado objetivo es amplio y no hay un segmento concreto.', 'Se han identificado segmentos posibles, sin prioridad justificada.', 'Existe un segmento prioritario descrito con criterios que permiten identificar clientes.', 'Las pruebas y acciones se concentran en ese segmento y la elección se revisa con evidencia.'] },
      { id: 'PM2', dim: 'D2', q: '¿Hay evidencia directa de que el problema es suficientemente importante para que el cliente actúe?',
        note: 'La importancia puede provenir del coste, frecuencia, riesgo o urgencia. Un problema infrecuente también puede ser relevante.',
        levels: ['No hay evidencia directa del problema.', 'Hay opiniones o interés declarado, sin ejemplos concretos de sus consecuencias.', 'Personas del segmento, también fuera del círculo cercano, describen casos y consecuencias concretas.', 'En distintos casos se observan gasto, tiempo o soluciones improvisadas dedicados hoy a resolverlo con las alternativas disponibles.'] },
      { id: 'PM3', dim: 'D2', q: '¿La estimación del mercado accesible se apoya en supuestos y datos contrastables?',
        note: 'Construya la estimación desde clientes identificables, precio y frecuencia; una cifra agregada de mercado sirve solo como contraste. Valore la trazabilidad y los límites de los supuestos.',
        levels: ['No existe una estimación útil del mercado accesible.', 'Hay una cifra general, sin supuestos claros sobre clientes o acceso.', 'La estimación explicita clientes alcanzables, precios o frecuencia y restricciones de acceso.', 'Los supuestos se contrastan con datos del segmento y se conoce la estructura competitiva: si el mercado está dominado por pocos actores o fragmentado, y qué barreras de entrada existen.'] },
      { id: 'PM4', dim: 'D2', q: '¿Puede explicarse, con datos, por qué este es el momento y qué facilita o dificulta hoy la adopción?',
        note: 'Incluya hábitos, costes de cambio, tecnología, regulación o ciclos de compra. Un mercado estable puede ser adecuado; no se exige un sector en auge.',
        levels: ['No se ha analizado qué hace que este sea el momento ni qué condiciona la adopción.', 'Se mencionan facilitadores o barreras, principalmente por intuición.', 'Se identifica algún cambio verificable (regulatorio, tecnológico, de coste, de hábito o de canal) y las barreras se han contrastado con personas o datos del segmento.', 'Las pruebas de adopción permiten ajustar la propuesta, el momento o la vía de entrada, y se sostiene con datos por qué no antes.'] },
      { id: 'VB1', dim: 'D3', q: '¿El cliente reconoce una ventaja concreta frente a las alternativas que utiliza hoy?',
        note: 'Incluya competidores, sustitutos, soluciones improvisadas (workarounds) y la opción de no hacer nada.',
        levels: ['No se conocen suficientemente las alternativas actuales.', 'La ventaja propuesta es principalmente una hipótesis interna.', 'Personas del segmento reconocen una ventaja específica frente a sus alternativas.', 'Esa ventaja explica decisiones observadas de uso, elección o compra en distintos casos.'] },
      { id: 'VB2', dim: 'D3', q: '¿Está contrastado quién pagaría, por qué concepto y bajo qué condiciones?',
        note: 'Evalúe la lógica de monetización. Los pagos y compromisos reales se examinan específicamente en C1.',
        levels: ['No se identifica con claridad quién pagaría ni por qué concepto.', 'Existe una hipótesis de pagador, precio y forma de cobro.', 'La hipótesis se ha contrastado con posibles pagadores y se conocen sus objeciones.', 'Las pruebas de oferta o negociación han permitido ajustar precio y condiciones, y el precio es coherente con el coste y la duración del ciclo de venta.'] },
      { id: 'VB3', dim: 'D3', q: '¿Las pruebas con usuarios reales muestran que la solución produce el resultado que promete?',
        applicabilityNote: 'Si el uso es puntual, no se exige repetición: valore si el resultado se confirma en distintos casos. No haber realizado pruebas se refleja en el nivel 0; no equivale a «No aplica».',
        note: 'El resultado puede ser ahorro de tiempo, reducción de errores u otro beneficio relevante. Adapte continuidad, repetición o retención al modelo.',
        levels: ['La solución todavía no se ha probado con usuarios del segmento.', 'Se ha mostrado un concepto o demo, sin observar el resultado de uso.', 'Usuarios del segmento han probado la solución y se ha observado el resultado obtenido.', 'El resultado se confirma en distintos casos y hay continuidad o repetición de uso cuando corresponde.'] },
      { id: 'C1', dim: 'D4', q: '¿Qué grado de compromiso comercial verificable ha obtenido la startup?',
        note: 'Diferencie interés, LOI, piloto con recursos comprometidos y pago. Un pago aislado no demuestra repetibilidad; anote contexto y condiciones.',
        levels: ['No hay señales comerciales documentadas.', 'Hay interés o conversaciones documentadas, sin recursos comprometidos.', 'Hay compromisos verificables de tiempo, acceso, recursos o compra, con alcance y condiciones explícitas.', 'Hay pagos o contratos verificables con soporte documental identificable (contrato, pedido o factura), con importe, alcance y condiciones.'] },
      { id: 'C2', dim: 'D4', q: '¿Se ha probado una forma de llegar y vender al segmento prioritario?',
        applicabilityNote: 'En ciclos comerciales largos pueden utilizarse avances verificables del proceso, aunque todavía no haya ventas. No haber probado el canal es una brecha de evidencia, no un «No aplica».',
        note: 'GTM: estrategia de llegada al mercado. Valore pruebas y resultados en relación con la duración del ciclo comercial.',
        levels: ['No hay una hipótesis concreta de canal o proceso comercial.', 'Existe una hipótesis de canal, mensaje y forma de venta para el segmento.', 'Se ha probado con clientes reales y se registran contactos, conversiones u otros resultados pertinentes.', 'Pruebas sucesivas muestran resultados comparables y se conoce cuánto tiempo y cuánto coste requiere conseguir un cliente por ese canal.'] },
      { id: 'F1', dim: 'D5', q: '¿Se conoce la caja disponible y cómo evoluciona con los cobros y pagos previstos?',
        note: 'Incluya burn neto y runway cuando exista consumo neto de caja. Si los cobros cubren los pagos, no fuerce un runway finito.',
        levels: ['No se conoce la caja disponible o los principales cobros y pagos.', 'Hay estimaciones aproximadas, sin conciliación con los movimientos reales.', 'La caja y los movimientos se registran y se conoce la necesidad de financiación a corto plazo.', 'La información se actualiza al menos mensualmente y se utiliza para decidir gastos y compromisos.'] },
      { id: 'F2', dim: 'D5', q: '¿Existe una previsión de caja que permita anticipar las necesidades de los próximos meses?',
        note: 'Como referencia, considere los próximos seis meses o el horizonte del siguiente hito cuando resulte más adecuado.',
        levels: ['No existe una previsión.', 'Hay una estimación informal de entradas y salidas.', 'Existe una previsión con supuestos explícitos sobre cobros, pagos y saldo de caja.', 'Se revisa frente a los datos reales y contempla escenarios para anticipar decisiones.'] },
      { id: 'F3', dim: 'D5', q: '¿Se conocen los recursos necesarios y su financiación para alcanzar el siguiente hito?',
        note: 'Incluya recursos propios, ingresos, ayudas u otras fuentes. No se presupone la necesidad de inversión externa.',
        levels: ['No está definido el siguiente hito o los recursos que requiere.', 'Hay una estimación de recursos sin conexión suficiente con las tareas del hito.', 'Se relacionan tareas, costes y recursos disponibles, identificando la posible brecha de financiación.', 'Se ajustan los recursos y el plan de financiación según el avance y la evidencia obtenida.'] },
      { id: 'F4', dim: 'D5', q: '¿Se conoce lo que cuesta conseguir y atender a un cliente y el margen que deja?',
        note: 'CAC y LTV son opciones cuando el modelo y los datos permiten estimarlos con sentido. Juzgue también si está clara la distinción entre una estimación preliminar y la falta de base para estimar.',
        conditional: 'No aplica todavía: si la fase del proyecto no permite una estimación fundamentada con datos o supuestos explícitos. Se registraría aparte, nunca como 0. Si hay datos suficientes pero no se analizan, corresponde el nivel 0.',
        levels: ['No se han analizado los costes de adquirir y servir al cliente ni el margen que aporta.', 'Existen estimaciones preliminares con supuestos y limitaciones identificados.', 'Se calculan costes y margen con datos reales para un segmento o grupo de clientes comparable.', 'Se revisan los cálculos y su incertidumbre para orientar precios, adquisición o servicio.'] },
      { id: 'SA1', dim: 'D6', q: '¿Las relaciones externas aportan recursos u oportunidades necesarios para el siguiente hito?',
        note: 'Valore contribuciones, no prestigio ni tamaño de la red. Incluya proveedores, clientes, comunidades, especialistas y colaboradores.',
        levels: ['No se han identificado las relaciones externas necesarias.', 'Hay contactos posibles, sin una contribución concreta acordada.', 'Existen contribuciones verificables vinculadas a necesidades del proyecto.', 'Las contribuciones se mantienen y facilitan avances concretos, gestionando dependencias.'] },
      { id: 'SA2', dim: 'D6', q: '¿Existen evidencias de confianza adecuadas a lo que necesitan clientes o socios para colaborar?',
        note: 'Pueden ser referencias, resultados de pruebas, experiencia demostrada, acreditaciones pertinentes o el aval de un cliente o institución de referencia. No se exige tener inversores ni apoyos prestigiosos.',
        levels: ['No se conoce qué evidencias de confianza necesita el cliente o socio.', 'Se conocen esas necesidades, pero solo hay afirmaciones o señales informales.', 'Hay referencias, resultados u otras evidencias verificables pertinentes para esas necesidades.', 'Esas evidencias han facilitado acuerdos, acceso o colaboración en casos concretos.'] }
    ],
    glossary: [
      { term: 'vesting', label: 'Vesting', definition: 'Adquisición progresiva de derechos sobre participaciones, sujeta a plazos o condiciones acordadas.' },
      { term: 'burn', label: 'Burn neto', definition: 'Consumo neto de caja durante un periodo: salidas menos entradas. Si no hay consumo neto positivo, el runway simple no se calcula de la misma manera.' },
      { term: 'runway', label: 'Runway', definition: 'Meses de caja disponibles bajo un escenario de consumo neto. Es una estimación dependiente de los supuestos, no una fecha garantizada.' },
      { term: 'cac', label: 'CAC', definition: 'Coste de adquisición de un cliente. Debe especificar qué costes incluye, el canal y el periodo considerado.' },
      { term: 'ltv', label: 'LTV', definition: 'Estimación de la contribución económica de un cliente durante su relación. Conviene explicitar margen, permanencia y limitaciones de los datos.' },
      { term: 'loi', label: 'LOI', definition: 'Carta de intención que expresa interés o condiciones preliminares. Su fuerza como evidencia depende del contenido y de los compromisos asumidos.' },
      { term: 'gtm', label: 'GTM', definition: 'Go-to-market: cómo se llega al segmento, se comunica el valor y se convierte el interés en una relación comercial.' },
      { term: 'top-down', label: 'Top-down', definition: 'Estimación que parte de cifras generales de mercado y acota la parte accesible mediante supuestos.' },
      { term: 'workarounds', label: 'Workarounds', definition: 'Soluciones improvisadas o combinaciones de herramientas que el cliente ya utiliza para resolver el problema.' }
    ]
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = instrument;
  else root.ValidationInstrument = instrument;
})(globalThis);
</script>
  <script>(function (root) {
  'use strict';
  const SCHEMA = 'expert-validation/1.9';
  const SKIPS = ['', 'experience', 'prefer', 'dimension'];
  const ROLES = ['Fundador/a', 'Inversor/a', 'Mentor/a o aceleradora', 'Académico/a', 'Consultor/a', 'Otro'];
  const PHASES = ['Idea', 'Validación', 'Primeras ventas', 'Repetición comercial'];
  const clone = value => JSON.parse(JSON.stringify(value));

    let value = control.value;

  async function submitResponses() {

    link.href = url;
    link.download = `validacion_experto_V1_9_${state.responseId}_${payload.exportedAt.replace(/[-:.]/g, '')}.json`;
    document.body.appendChild(link);
    try {
      link.click(); state = model.markExport(state); persist();
      document.getElementById('export-receipt').hidden = false;
      document.getElementById('export-stale').hidden = true;
    }
    finally { link.remove(); setTimeout(() => URL.revokeObjectURL(url), 1500); }
  }
  async function copyResponses() {
    flushText();
    const payload = model.exportPayload(state);
    const raw = JSON.stringify(payload, null, 2);
    const status = document.getElementById('copy-status');
    const holder = document.getElementById('manual-copy-wrapper');
    const stillCurrent = () => state.responseId === payload.response.responseId && state.revision === payload.response.revision && pendingText.size === 0;
    status.textContent = 'Preparando la copia…';
    try {
      if (!navigator.clipboard?.writeText) throw new Error('Clipboard unavailable');
      await navigator.clipboard.writeText(raw);
      status.textContent = stillCurrent() ? 'Respuestas copiadas. Abra el correo y péguelas en el mensaje. Todavía no se han enviado.' : 'Las respuestas han cambiado durante la copia. Vuelva a copiarlas antes de enviarlas.';
    } catch {
      if (!stillCurrent()) { status.textContent = 'Las respuestas han cambiado. Pulse de nuevo «Copiar respuestas».'; return; }
      status.textContent = 'El navegador no permite copiar automáticamente. Copie el texto seleccionado o descargue el archivo.';
      const label = document.createElement('label'); label.htmlFor = 'manual-copy'; label.textContent = 'Respuestas para copiar y pegar en el correo';
      const textarea = document.createElement('textarea'); textarea.id = 'manual-copy'; textarea.readOnly = true; textarea.value = raw;
      holder.replaceChildren(label, textarea); holder.hidden = false;
      textarea.focus(); textarea.select();
    }
  }
  function renderPrint() {
    flushText();
    const payload = model.exportPayload(state), response = payload.response;
    document.body.dataset.printMode = printMode;
    if (printMode === 'map') {
      document.getElementById('print-view').innerHTML = `<h1>Resumen de sus respuestas</h1><p class="print-note">Validación de expertos V1.9 · Último cambio: ${esc(new Date(state.updatedAt).toLocaleString('es-ES'))} · ${esc(state.responseId)}<br>Valoraciones del experto de 1 a 4. — = sin responder. Omitida = excluida del análisis.</p><p class="print-note">T: Equipo (Team). PM: Problema y mercado. VB: Propuesta de valor y modelo de negocio. C: Evidencia comercial. F: Finanzas. SA: Recursos estratégicos y legitimidad.</p>${summaryMap(false)}`;
      return;
    }
    document.getElementById('print-view').innerHTML = `<h1>Validación de expertos · V1.9</h1><p>Diagnóstico para startups en fase temprana</p><p class="print-note">Respuesta ${esc(state.responseId)} · Último cambio: ${esc(new Date(state.updatedAt).toLocaleString('es-ES'))} · ${esc(new Date().toLocaleString('es-ES'))}<br>Esta copia no acredita envío ni recepción.</p><p>${payload.summary.complete} bloques completos; ${payload.summary.partial} parciales; ${payload.summary.pending} pendientes; ${payload.summary.skipped} omitidos.</p><h2>Perfil y mirada inicial</h2><p class="pre-wrap">${esc(profileText())}</p><p class="pre-wrap">${esc(state.initial.text || 'Mirada inicial sin respuesta')}</p>
      ${instrument.dimensions.map(dim => `<h2>${dimensionLabel(dim.id)} · ${esc(dim.name)}</h2><p>${model.status(response, dim.id) === 'skipped' ? 'Dimensión omitida' : esc(scoreText(response.dimensions[dim.id], model.dimCriteria))}</p><p class="pre-wrap">${esc(response.dimensions[dim.id].comment)}</p>${instrument.items.filter(i => i.dim === dim.id).map(item => `<article><strong>${questionLabel(item)} · ${esc(item.q)}</strong><p>${model.status(response, item.id) === 'skipped' ? 'Pregunta omitida: sus puntuaciones se excluyen.' : esc(scoreText(response.items[item.id], model.itemCriteria))}</p><p class="pre-wrap">${esc(response.items[item.id].comment || 'Sin comentario')}</p></article>`).join('')}`).join('')}
      <h2>Valoración final</h2>${finalQuestions.map(([key, label]) => `<article><strong>${esc(label)}</strong><p class="pre-wrap">${esc(state.final[key] || 'Sin respuesta')}</p></article>`).join('')}`;
  }
  document.getElementById('import-button').addEventListener('click', () => document.getElementById('import-file').click());
  document.getElementById('import-file').addEventListener('change', async event => {
    flushText();
    const file = event.target.files?.[0];
    if (!file) return;
    try {
      if (file.size > 1024 * 1024) throw new Error('El archivo supera 1 MB. Seleccione una exportación de este formulario.');
      const raw = await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = () => reject(new Error('No se pudo leer el archivo.')); reader.readAsText(file); });
      let payload;
      try { payload = JSON.parse(raw); } catch { throw new Error('El archivo no contiene JSON válido. No se ha cambiado su borrador.'); }
      const incoming = model.importPayload(payload);
      if ((state.revision > 0 || writeBlocked) && !window.confirm('Recuperar este archivo reemplazará el borrador de este navegador. Si necesita conservarlo, cancele y descargue primero sus respuestas. ¿Recuperar el archivo?')) return;
      flushText();
      state = incoming;
      if (!model.canVisit(state, state.step)) state.step = state.consent ? 1 : 0;
      writeBlocked = false;
      const saved = persist();
      render();
      message(saved ? '' : 'Archivo recuperado en esta ventana. El navegador no permite guardarlo localmente; descargue una copia antes de cerrar.');
      document.getElementById('page-title').focus();
    } catch (error) { message(error.message); }
    finally { event.target.value = ''; }
  });
  document.getElementById('reset-button').addEventListener('click', () => {
    flushText();
    if (!window.confirm('Se iniciará una respuesta nueva y se reemplazará el borrador local. Cancele y descargue primero la respuesta actual si necesita conservarla. ¿Comenzar otra respuesta?')) return;
    state = model.createState(globalThis.crypto?.randomUUID?.() || ('response-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2)));
    writeBlocked = false;
    message(''); persist(); render();
    document.getElementById('page-title').focus();
  });
  window.addEventListener('pagehide', () => { flushText(); persist(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushText(); });
  window.addEventListener('beforeprint', () => { if (state.consent) renderPrint(); });
  window.addEventListener('storage', event => {
    if (event.key === STORAGE_KEY && event.newValue !== JSON.stringify(state)) {
      writeBlocked = true;
      setSaveStatus(false);
      message('La respuesta guardada ha cambiado en otra ventana. Esta ventana conserva su borrador y ha detenido el guardado para evitar sobrescribirlo. Descargue aquí la copia que quiera conservar; después, recargue esta pestaña para continuar con la copia guardada.');
    }
  });
  render();
  if (writeBlocked) setSaveStatus(false);
  else if (restored.value) setSaveStatus(true);
  else document.getElementById('save-state').textContent = 'El guardado local comienza cuando responde. También puede descargar una copia.';
})();
</script>
